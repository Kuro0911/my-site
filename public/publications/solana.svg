    <text x="57" y="434" fill="#504956" font-family="sans-serif" font-size="21">with security labels</text>
  </g>
  <path d="M316 298h19" stroke="#604092" stroke-width="3" marker-end="url(#arrow)"/>
  <g>
    <rect x="347" y="126" width="278" height="360" rx="16" fill="#604092" opacity=".16"/>
    <rect x="341" y="118" width="278" height="360" rx="16" fill="#fff" stroke="#604092" stroke-width="2"/>
