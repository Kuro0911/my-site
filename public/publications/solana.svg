  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#604092" opacity=".13"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="m1 1 7 4-7 4" fill="none" stroke="#604092" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="960" height="600" fill="#fbfaf8"/>
  <rect width="960" height="600" fill="url(#grid)"/>
  <path d="M0 0h960v10H0zM0 590h960v10H0z" fill="#604092"/>
  <g>
