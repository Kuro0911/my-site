    <g transform="translate(450 176)" fill="none" stroke="#604092" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="11" y="11" width="38" height="38" rx="6"/><rect x="22" y="22" width="16" height="16" rx="2"/><path d="M20 4v7m20-7v7M20 49v7m20-7v7M4 20h7m-7 20h7m38-20h7m-7 20h7"/></g>
    <text x="364" y="314" fill="#604092" font-family="monospace" font-size="16" font-weight="700">02 / MODEL ADAPTATION</text>
    <text x="364" y="360" fill="#211a26" font-family="sans-serif" font-size="25" font-weight="700">Fine-tune</text>
    <text x="364" y="404" fill="#504956" font-family="sans-serif" font-size="21">Adapt Mistral-7B</text>
    <text x="364" y="434" fill="#504956" font-family="sans-serif" font-size="21">for contract review</text>
